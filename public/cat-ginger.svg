<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- ginger tabby, sitting, facing slightly left -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a050"/><stop offset="1" stop-color="#d9782c"/>
    </linearGradient>
  </defs>
  <!-- tail (grouped so the overlay can flick it while he perches on a reagent) -->
  <g class="tail">
    <path d="M86 98c16 2 26-8 22-22-2-7-9-9-12-4" fill="none" stroke="#c4651f" stroke-width="9" stroke-linecap="round"/>
    <path d="M86 98c16 2 26-8 22-22-2-7-9-9-12-4" fill="none" stroke="#f0a050" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- body -->
  <path d="M34 108c-4-30 8-52 30-52s34 22 30 52z" fill="url(#fur)" stroke="#8a4a12" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- body stripes -->
  <path d="M42 80c8-3 16-3 24 0M40 92c9-3 19-3 28 0" fill="none" stroke="#c4651f" stroke-width="4" stroke-linecap="round"/>
  <!-- chest -->
  <ellipse cx="60" cy="94" rx="12" ry="14" fill="#fbe8cf"/>
  <!-- front paws -->
  <ellipse cx="50" cy="107" rx="8" ry="5" fill="#f0a050" stroke="#8a4a12" stroke-width="2"/>
  <ellipse cx="68" cy="107" rx="8" ry="5" fill="#f0a050" stroke="#8a4a12" stroke-width="2"/>
  <!-- head -->
  <circle cx="58" cy="44" r="22" fill="url(#fur)" stroke="#8a4a12" stroke-width="2.5"/>
  <!-- ears -->
  <path d="M40 32L36 10l17 14z" fill="#f0a050" stroke="#8a4a12" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M76 32L80 10 63 24z" fill="#f0a050" stroke="#8a4a12" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M42 29l-3-13 11 10z" fill="#f3b8b0"/>
  <path d="M74 29l3-13-11 10z" fill="#f3b8b0"/>
  <!-- forehead stripes -->
  <path d="M52 26v10M58 24v11M64 26v10" fill="none" stroke="#c4651f" stroke-width="3.5" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="58" cy="52" rx="11" ry="8" fill="#fbe8cf"/>
  <!-- eyes (grouped so the phone page can blink them) -->
  <g class="eyes">
    <ellipse cx="50" cy="43" rx="4" ry="5" fill="#8fd16b"/><ellipse cx="66" cy="43" rx="4" ry="5" fill="#8fd16b"/>
    <ellipse cx="50" cy="43" rx="1.6" ry="4.2" fill="#1e2a12"/><ellipse cx="66" cy="43" rx="1.6" ry="4.2" fill="#1e2a12"/>
  </g>
  <!-- nose + mouth -->
  <path d="M55 50h6l-3 3z" fill="#e58a8a"/>
  <path d="M58 53c-1 3-4 3-5 1M58 53c1 3 4 3 5 1" fill="none" stroke="#8a4a12" stroke-width="1.5" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M46 50l-12-2M46 53l-12 2M70 50l12-2M70 53l12 2" fill="none" stroke="#fbe8cf" stroke-width="1.5" stroke-linecap="round"/>
</svg>
