[package]
name = "webinar-overlay"
version = "0.1.0"
description = "Transparent, always-on-top presenter overlay for the webinar"
authors = ["Bobby"]
edition = "2021"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "webinar_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# GetAsyncKeyState (polling the physical Ctrl+Shift state) and GetCursorPos (mouse for the ankh quorum).
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
